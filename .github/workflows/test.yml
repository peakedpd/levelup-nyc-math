name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    name: Math + diagnostic verification (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Adaptive diagnostic simulation (placement accuracy, formats, gaps, misconceptions, reassessment)
        run: node tools/verify_assess.js
      - name: Mastery model + transfer items
        run: node tools/verify_mastery.js
      - name: Item generators (9 skills x 6 levels x 3000 seeds)
        run: node tools/verify_learn.js
      - name: Item bank (verified answer/explanation, standard, difficulty, misconceptions, review status)
        run: node tools/verify_itembank.js
      - name: Instructional depth (multi-step, strategies, reasoning, rubric, interventions)
        run: node tools/verify_depth.js
      - name: Teacher platform (codes, cross-device merge, analytics, recommendations, assignments, sync adapters)
        run: node tools/verify_classroom.js
      - name: Reteach Plan (13 misconceptions + 9 standards content, every lesson/exit-ticket number, ranking logic on simulated classes)
        run: node tools/verify_reteach.js
      - name: Weakness Challenges (target selection, adaptive difficulty, battle progression, Memory Checks, streaks, badges, gap report)
        run: node tools/verify_challenge.js
      - name: Real-life game scenes (objects match the answer, never give it away, every skill has one)
        run: node tools/verify_scenes.js
      - name: Ticket Blaster VR answer key (4.NF.A.1, independent)
        run: node tools/verify_tbvr.js
      - name: Arcade cabinet math answer keys (9 grade-4 standards + XP wager rules, independent)
        run: node tools/verify_cabinets.js
      - name: Universe math moments (13 generators x 3000 seeds, independent key)
        run: node tools/verify_universe.js
      - name: Shipped build consistency
        run: node tools/check_dist.js
  e2e:
    name: Headless browser play-tests
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 60
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save --no-audit --no-fund playwright@1.65.1
      - name: Serve the site
        run: (python3 -m http.server 8765 >/dev/null 2>&1 &) && sleep 2
      - name: Mission answer-key verification (independent key)
        run: node tools/verify_math.js
      - name: Placement Quest e2e (desktop)
        run: TAG=ci_diag HOOK=./p1diag.js node test/play.js
      - name: Mastery e2e (Tower Climb evidence, Memory Checks, mastery)
        run: TAG=ci_mastery HOOK=./p2mastery.js node test/play.js
      - name: Depth e2e (reasoning, multi-step, showdown, explain-it, intervention mission)
        run: TAG=ci_depth HOOK=./p4depth.js node test/play.js
      - name: Teacher Hub + My Class e2e (class code, analytics, assignments, growth report, cross-device merge)
        run: TAG=ci_class HOOK=./p5class.js node test/play.js
      - name: Reteach Plan e2e (empty state, labeled demo, real results, groups, one-tap assign, CSV)
        run: TAG=ci_reteach HOOK=./p6reteach.js node test/play.js
      - name: Weakness Challenge e2e (Your Challenge today, Brock boss battle, reteach on wrong, Memory Check, teacher assign, gap table)
        run: TAG=ci_challenge HOOK=./p7challenge.js node test/play.js
      - name: Brock in the 3D street e2e (stands at the challenge spot, walk-up starts it, friendly after defeat)
        run: TAG=ci_brock3d HOOK=./p8brock.js node test/play.js
      - name: Avatar movement e2e (real keyboard after load/popups, next to Theo + Brock, Go to in 3D, no 2D map, no-WebGL message)
        run: TAG=ci_move HOOK=./p9move.js node test/play.js
      - name: Real-life games e2e (Theo's street game, Play it for real from a lesson, objects for all 9 skills)
        run: TAG=ci_real HOOK=./p10real.js node test/play.js
      - name: Arcade EXIT door e2e (returns to an open sidewalk, player can move, no roof trap)
        run: TAG=ci_exit HOOK=./p11exit.js node test/play.js
      - name: Ticket Blaster VR e2e (sit in the pod, goggles on, 4.NF.A.1 start screen, blast right/wrong targets, tickets by accuracy, exit and walk)
        run: TAG=ci_vr HOOK=./p12vr.js node test/play.js
      - name: Ticket Blaster VR on a phone (390x844, touch taps)
        run: TAG=ci_vr_phone W=390 H=844 TOUCH=1 HOOK=./p12vr.js node test/play.js
      - name: Arcade cabinet math e2e (E opens each machine, standard shown, wrong -> hint + retry, round pays tickets, Prize Claw XP wager win/loss/cap, XP never below 0)
        run: TAG=ci_cab HOOK=./p13cabinets.js node test/play.js
      - name: Arcade cabinet math on a phone (390x844, touch E + taps)
        run: TAG=ci_cab_phone W=390 H=844 TOUCH=1 HOOK=./p13cabinets.js node test/play.js
      - name: Universe e2e (trash can lid + contents, hydrant, lamp, tree, newsstand math moment, E priority, flat-panel audit)
        run: TAG=ci_universe HOOK=./p13universe.js node test/play.js
      - name: Cinematic conversations e2e (letterbox, face-framing camera, subtitles, character voices for Theo, Marcia, Okafor, Arcade Worker, Mr. Sal, Brock)
        run: TAG=ci_cine HOOK=./p13cine.js node test/play.js
      - name: Cinematic conversations on a phone (390x844, touch taps)
        run: TAG=ci_cine_phone W=390 H=844 TOUCH=1 HOOK=./p13cine.js node test/play.js
      - name: Classroom 3D e2e (real 3D furniture/whiteboard/clock/windows load, walkways + collisions, Ms. Okafor station, no console errors)
        run: TAG=ci_classroom HOOK=./p13classroom.js node test/play.js
      - name: Classroom 3D on a phone (390x844, touch)
        run: TAG=ci_classroom_phone W=390 H=844 TOUCH=1 HOOK=./p13classroom.js node test/play.js
      - name: Educator review page e2e
        run: node test/p3review.js
      - name: 3D street smoke (phone 390x844, touch)
        run: TAG=ci_phone W=390 H=844 TOUCH=1 node test/play.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: shots/, retention-days: 7 }
